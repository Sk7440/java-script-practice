<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Jokes</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        padding: 20px;
      }

      .container {
        max-width: 700px;
        width: 100%;
        background: #fff;
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      }

      h1 {
        font-size: 2.5rem;
        color: #333;
        margin-bottom: 30px;
      }

      p {
        font-size: 1.3rem;
        color: #555;
        line-height: 1.8;
        background: #f8f9fa;
        border-left: 6px solid #4facfe;
        padding: 20px;
        border-radius: 12px;
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.3s ease;
      }

      p:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
      }

      @media (max-width: 600px) {
        .container {
          padding: 25px;
        }

        h1 {
          font-size: 2rem;
        }

        p {
          font-size: 1.1rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>😂 Best Jokes</h1>
      <p></p>
    </div>

    <script>
      // fetch("https://icanhazdadjoke.com/", {
      //   headers: {
      //     Accept: "application/json",
      //   },
      // })
      //   .then((response) => {
      //     console.log(response.status);
      //     if (!response.ok) {
      //       throw new Error(`Request failed with status ${response.status}`);
      //     }
      //     return response.json();
      //   })
      //   .then((data) => {
      //     console.log(data);

      //     pTag.innerHTML = `${data.joke}`;
      //   })
      //   .catch((error) => {
      //     console.log(error);
          
      //     pTag.innerHTML = `${error} jokes`;
      //   })
      //   .finally(() => {});
      let pTag = document.querySelector("p");

      async function getUser() {
        try {
          const response = await fetch("https://icanhazdadjoke.com/ ", {
            headers: {
              Accept: "application/json",
            },
          });

          console.log("Status code:", response.status);

          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const data = await response.json();

          console.log(data);
          
          pTag.innerHTML = ` ${data.joke}`;

          return data;
        } catch (error) {
         pTag.innerHTML=`Something went wrong:${error.message}`
        } finally {
          console.log("async/await: finished (finally block)");
        }
      }

      getUser();
    </script>
  </body>
</html>

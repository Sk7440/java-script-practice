    /* ================================================================
   PART 1: WHAT fetch() ACTUALLY GIVES YOU
   ================================================================
   fetch(url) returns a PROMISE. Not the data itself — a
   promise that EVENTUALLY becomes the data (or an error).

   That promise resolves in TWO STAGES:
     Stage 1: the server responds with headers/status
              (fetch's promise resolves HERE)
     Stage 2: you still have to unpack the actual body
              (response.json() is a SEPARATE promise)

   This is why every fetch call needs to "wait" twice.
*/

// const promise = new Promise((resolve, reject) => {
    
// })


/* ================================================================
   PART 2: THE .then() / .catch() / .finally() WAY
   ================================================================ */

console.log('--- PART 2: .then chain starting ---');

fetch('https://jsonplaceholder.typicode.com/users/1')
    .then((response) => {
        // Stage 1 done: we have headers + status, NOT the data yet
        console.log('Status code:', response.status);

        // fetch does NOT reject on 404/500 by itself!
        // You must check response.ok manually.
        if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
            // throwing here skips straight to .catch() below
        }

        return response.json();
        // Stage 2: unpacking the body — ALSO returns a promise.
        // Returning it here means the NEXT .then() waits for it.
    })
    .then((data) => {
        // NOW we finally have the actual data
        console.log(data);
        
        console.log('User name:', data.name);
        console.log('User email:', data.email);
    })
    .catch((error) => {
        // catches a rejected fetch (network down, DNS fail, offline)
        // AND the manual throw above (bad status code)
        console.log('Something went wrong:', error.message);
    })
    .finally(() => {
        // ALWAYS runs — success or failure, doesn't matter.
        // Perfect place for "hide the loading spinner" type code.
        console.log('.then chain: finished (finally block)');
    });


/* ----------------------------------------------------------------
   WHAT EACH PIECE MEANS, ISOLATED:
   ----------------------------------------------------------------
   .then(onSuccess)          → runs if the promise resolves
   .then(a, b)                → rarely used, ignore for now
   .catch(onFailure)          → runs if ANYTHING above it rejects
                                 or throws — catches ALL earlier
                                 failures in the chain, not just
                                 the .then() right above it
   .finally(cleanup)          → runs no matter what, always last

   THE ORDER MATTERS: .catch() should usually come AFTER all
   your .then() calls, and .finally() last of all, so it can
   clean up regardless of outcome.
*/


/* ================================================================

   async/await is NOT a different tool. It's the SAME promise
   underneath — just written to read top-to-bottom instead of
   chained with .then(). Compare this to Part 2 above; it does
   the exact same thing.

   3 RULES:
     1. `await` only works inside a function marked `async`
     2. `await` pauses that function until the promise settles
     3. use try/catch instead of .catch() for errors
*/

/* ================================================================
   QUICK REFERENCE — KEEP THIS NEARBY
   ================================================================

   .then() chain style:
   -----------------------------------------------
   fetch(url)
     .then(res => {
       if (!res.ok) throw new Error('bad status');
       return res.json();
     })
     .then(data => console.log(data))
     .catch(err => console.log(err.message))
     .finally(() => console.log('done'));

   async/await style (same thing):
   -----------------------------------------------
   async function load() {
     try {
       const res = await fetch(url);
       if (!res.ok) throw new Error('bad status');
       const data = await res.json();
       console.log(data);
     } catch (err) {
       console.log(err.message);
     } finally {
       console.log('done');
     }
   }

   Both do the exact same job. async/await is just easier to
   read once you have more than 1-2 steps. In React and Node
   you'll see BOTH styles used — you need to recognize both,
   but you'll almost always WRITE with async/await.
================================================================

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body></body>
  <script>
    fetch("https://jsonplaceholder.typicode.com/users/5")
      ////.then wo wait krta h response ka
      .then((response) => {
        console.log(response);

        // reponse ko log m show karwaya jata
        console.log("Status code:", response.status);

        if (!response.ok) {
          // agr response mily magr server humy error bhj dy to osko ko handle krny ky lye reponse .ok ky zarye hum khud erroe bhjty hain
          throw new Error(`Request failed with status ${response.status}`);
        }
        // response ko json kr ky return kry
        return response.json();
        /////client or server darmayan jitni b baat hoti h sb json ki form hoti h jo data hamnry pass ata h osy convert krny ky liye .json() ka istamal hota h
      })
      // opr waly reponse ko dekhty howy mazeed wait krna pry ga osky lye then ka istamal krygyn
      .then((data) => {
        console.log(data);
        
        // .then ky aandr data revice hoga
        // jiss ko console.log(); m shiw krwa dyn gyn

        console.log("User name:", data.name);
        console.log("User email:", data.email);
      })
      .catch((error) => {
        console.log("Something went wrong:", error.message);
      })
      .finally(() => {
        console.log(".then chain: finished (finally block)");
      });
  </script>
</html>

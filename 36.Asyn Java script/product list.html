<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Lists</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
      }

      .render-div {
        width: 380px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 30px;
        color: #fff;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        transition: 0.4s ease;
      }

      .render-div:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      }

      .render-div h1,
      .render-div h2,
      .render-div h3 {
        margin: 16px 0;
        font-weight: 500;
        line-height: 1.5;
        word-break: break-word;
      }

      .render-div h1 {
        font-size: 1.7rem;
        color: #fff;
        border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        padding-bottom: 12px;
      }

      .render-div h2 {
        font-size: 1.2rem;
      }

      .render-div h3 {
        font-size: 1rem;
        color: #d1d5db;
      }

      .render-div span {
        color: #38bdf8;
        font-weight: 700;
      }

      button {
        width: 100%;
        margin-top: 25px;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        letter-spacing: 0.5px;
      }

      button:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
      }

      button:active {
        transform: scale(0.98);
      }

      @media (max-width: 768px) {
        body {
          padding: 20px;
        }

        body > h1 {
          font-size: 2.2rem;
        }

        div > div {
          width: 100%;
        }
      }
      .btn-group {
        display: flex;
        gap: 20px;
        margin-top: 25px;
      }

      .back-btn,
      .details-btn {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      /* Back Button */
      .back-btn {
        background: transparent;
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.25);
      }

      .back-btn:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: #38bdf8;
        color: #38bdf8;
        transform: translateY(-3px);
      }

      /* See Details Button */
      .details-btn {
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        color: #fff;
      }

      .details-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
      }

      .back-btn:active,
      .details-btn:active {
        transform: scale(0.97);
      }
      .container.active {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 2fr));
        gap: 30px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
      }
      .details,
      .container,
      .loading {
        display: none;
      }

      .loading.active {
        display: flex;
      }
      .render-div img {
        width: 100%;
        object-fit: cover;
      }
      .details.active {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-direction: row;
      }
      .img-div {
        width: 50%;
        height: 50%;
        object-fit: cover;
      }
      .img-div img {
        width: 100%;
      }
      /* From Uiverse.io by ShaikhWahid99 */ 
.liquid-loader {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 20px;
  font-family: system-ui, sans-serif;
}

.loader-track {
  position: relative;
  width: 180px;
  height: 32px;
  background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
  border-radius: 16px;
  overflow: hidden;
  box-shadow:
    inset 0 2px 4px rgba(0, 0, 0, 0.6),
    0 1px 3px rgba(255, 255, 255, 0.1);
}

.liquid-fill {
  position: absolute;
  top: 2px;
  left: 2px;
  height: calc(100% - 4px);
  background: linear-gradient(90deg, #4f46e5, #7c3aed, #ec4899, #f59e0b);
  border-radius: 14px;
  animation:
    fillProgress 4s ease-out infinite,
    colorShift 3s linear infinite;
  box-shadow:
    0 0 12px rgba(124, 58, 237, 0.4),
    inset 0 1px 2px rgba(255, 255, 255, 0.2);
}

.loading-text {
  color: white;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 1px;
  animation: textGlow 1s ease-in-out infinite;
}

.dot {
  margin-left: 3px;
  animation: blink 1.5s infinite;
}
.dot:nth-of-type(1) {
  animation-delay: 0s;
}
.dot:nth-of-type(2) {
  animation-delay: 0.3s;
}
.dot:nth-of-type(3) {
  animation-delay: 0.6s;
}

@keyframes fillProgress {
  0% {
    width: 4px;
  }
  25% {
    width: 25%;
  }
  50% {
    width: 50%;
  }
  75% {
    width: 75%;
  }
  100% {
    width: calc(100% - 4px);
  }
}

@keyframes colorShift {
  0% {
    filter: hue-rotate(0deg) brightness(1);
  }
  33% {
    filter: hue-rotate(120deg) brightness(1.1);
  }
  66% {
    filter: hue-rotate(240deg) brightness(0.9);
  }
  100% {
    filter: hue-rotate(360deg) brightness(1);
  }
}

@keyframes textGlow {
  0%,
  100% {
    opacity: 0.7;
    text-shadow: 0 0 8px rgba(139, 92, 246, 0.3);
  }
  50% {
    opacity: 1;
    text-shadow: 0 0 16px rgba(139, 92, 246, 0.6);
  }
}

@keyframes blink {
  0%,
  50% {
    opacity: 1;
  }
  51%,
  100% {
    opacity: 0;
  }
}

    </style>
  </head>
  <body>
    <div class="container"></div>
    <div class="details"></div>
    <div class="loading">
<div class="liquid-loader">
  <div class="loading-text">
    Loading<span class="dot">.</span><span class="dot">.</span
    ><span class="dot">.</span>
  </div>

  <div class="loader-track">
    <div class="liquid-fill"></div>
  </div>
</div>
    </div>
  </body>

  <script>
    let divTag = document.querySelector(".container");
    let detailDiv = document.querySelector(".details");
    let loadingDiv = document.querySelector(".loading");

    let singleProduct;
    let data;

    async function getUser() {
      try {
        loadingDiv.classList.add("active");
        divTag.classList.add("active");

        const response = await fetch("https://dummyjson.com/products");

        console.log("Status code:", response.status);

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        data = await response.json();

        return data;
      } catch (error) {
        divTag.innerHTML = `"Something went wrong:", ${error.message}`;
      } finally {
        loadingDiv.classList.remove("active");
        render();
      }
    }

    getUser();
    function render() {
      data.products.forEach((ele, idx) => {
        divTag.innerHTML += ` <div class="render-div">

          <img src="${ele.images[0]}" alt="">

              <h1> ${ele.title}</h1>
              <h3><span>Price </span>: $ ${ele.price}</h3>
              <button onclick="product(${ele.id})">See details</button>

              </div>`;
      });
    }
    async function product(id) {
      try {
        divTag.classList.remove("active");
        loadingDiv.classList.add("active");

        let response = await fetch(`https://dummyjson.com/product/${id}`);

        console.log("Status code:", response.status);

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        singleProduct = await response.json();
        detailDiv.classList.add("active");

        console.log(singleProduct);

        return data;
      } catch (error) {
        divTag.innerHTML = `"Something went wrong:", ${error.message}`;
      } finally {
        loadingDiv.classList.remove("active");
        spRender();
      }
    }
    function spRender() {
      detailDiv.innerHTML = `

      <div class="img-div">
        <img src="${singleProduct.images[0]}" alt="">
        </div>
        <div class="render-div">
          <div class="btn-group">
           <button onclick="Back()" class="back-btn">← Back</button>
           </div>   


        <h1> ${singleProduct.title}</h1>
              <h2><span>Id </span>: ${singleProduct.id}</h2>
              <h3><span>Description </span>: ${singleProduct.description}</h3>
              <h3><span>Category </span>: ${singleProduct.category}</h3>
              <h3><span>Price </span>: $ ${singleProduct.price}</h3>
              <h3><span>Status </span>: ${singleProduct.availabilityStatus}</h3>
              <h3><span>Brand </span>: ${singleProduct.brand}</h3>
              <h3><span>Rating </span>: ${singleProduct.rating}</h3>
              <h3><span>Width </span>: ${singleProduct.dimensions.width}</h3>
              <h3><span>height </span>: ${singleProduct.dimensions.height}</h3>
              <h3><span>depth </span>: ${singleProduct.dimensions.depth}</h3>
              <h3><span>return policy </span>: ${singleProduct.returnPolicy}</h3>
              <h3><span>Stock </span>: ${singleProduct.stock}</h3>

              </div>`;
    }
    function Back() {
      detailDiv.classList.remove("active");
      divTag.classList.add("active");
    }
  </script>
</html>

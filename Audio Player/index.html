<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .player {
      width: 350px;
      background: #222;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .progress-container {
      height: 8px;
      background: #555;
      border-radius: 50px;
      cursor: pointer;
      margin: 20px 0;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #00c6ff;
      border-radius: 50px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    button {
      padding: 12px 18px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }

    button:hover {
      background: #00c6ff;
      color: white;
    }

    .time {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    ul {
      list-style: none;
      margin-top: 15px;
      text-align: left;
    }
    #pause {
      display: none;
    }
    #pause.active {
      display: flex;
    }
    .nonactive {
      display: none;
    }
  </style>

  <body>
    <div class="player">
      <img
        id="cover"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1R6AEGwy2SeGyQTFzTU7puXwkOg_ZVhgdLK41au11Mg&s=10"
      />

      <h2 id="title">Song Title</h2>
      <p id="artist">Artist Name</p>

      <audio id="audio"></audio>

      <div class="progress-container" id="progress-container">
        <div class="progress" id="progress"></div>
      </div>

      <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="prev">⏮</button>
        <button id="play">▶</button>
        <button id="pause">||</button>
        <button id="next">⏭</button>
      </div>

      <h3>Playlist</h3>

      <ul id="playlist"></ul>
    </div>
  </body>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
  </head>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .player {
      width: 350px;
      background: #222;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .progress-container {
      height: 8px;
      background: #555;
      border-radius: 50px;
      cursor: pointer;
      margin: 20px 0;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #00c6ff;
      border-radius: 50px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    button {
      padding: 12px 18px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }

    button:hover {
      background: #00c6ff;
      color: white;
    }

    .time {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    ul {
      list-style: none;
      margin-top: 15px;
      text-align: left;
    }
    .ri-pause-line {
      display: none;
    }
    .ri-pause-line.active {
      display: flex;
    }

    .nonactive {
      display: none;
    }
  </style>

  <body>
    <div class="player">
      <div class="intro"></div>
      <audio id="audio"></audio>
      <input type="range" id="progress" min="0" max="100" value="0" />

      <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="prev">⏮</button>
        <button id="play">
          <i class="ri-play-line"></i><i class="ri-pause-line"></i>
        </button>
        <button id="next">⏭</button>
      </div>
    </div>
  </body>
  <script>
    let playBtn = document.querySelector("#play");
    let playIcon = document.querySelector(".ri-play-line");
    let pauseIcon = document.querySelector(".ri-pause-line");
    let nextBtn = document.querySelector("#next");
    let prevBtn = document.querySelector("#prev");
    let intro = document.querySelector(".intro");
    let currentTime = document.querySelector("#current");
    let duration = document.querySelector("#duration");
    let progress = document.querySelector("#progress");
    let isPlaying = false;
    let songsdata = [
      {
        title: "landan jafri remix",
        artist: "main nai bataon ga",
        src: "./Laddan jafri Funny remix main nahi bataunga song Laddan Jaffri Bol news interview DJ remix - News In Motion (128k).mp3",
        image:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyg-JenMgG0j5tfvVH59WC0gah6KwzbqqcLXFj_eU8Bg&s=10",
      },
      {
        title: "famous meme",
        artist: "moota kadoo",
        src: "./German Meme song.mp3",
        image:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjKdyFz5BgyIwaEol3qVkdReYpOXWs6VNryqL1hxQ_Qg&s",
      },
      {
        title: "bilawal remix",
        artist: "bhuutoo",
        src: "./Baarish aata hai to paani aata hai Funny remix Bilawal bhutto funny remix meme song - Mustafa Nadeem (128k).mp3",
        image:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT0S86msUu0yxIJmKulbctao9ZBl87h9SALRtGKFDTo7A&s=10",
      },
      {
        title: "pawari ho rai h",
        artist: "pata nai",
        src: "./Pawri Hori Hai Yashraj Mukhate Dialogue With Beats - Yashraj Mukhate (128k).mp3",
        image:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrpe3XxCaB1N-A2r_IINyMQfS5JtcKc_rs0-N8RX5Aow&s=10",
      },
      {
        title: "gham m sowyn hain",
        artist: "babar azam",
        src: "./babar azam funny dance memes - ABii Gaming (128k).mp3",
        image:
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQz2WnKQXKHrSp-EvVShcZjCDxANkkIRxG6lDYvZggqaA&s=10",
      },
    ];
    let count = 0;
    let audio = new Audio(`${songsdata[count].src}`);
    let inpRange = document.querySelector("input");

    audio.addEventListener("timeupdate", () => {
      progress.value = (audio.currentTime / audio.duration) * 100;
      let totalSeconds = Math.floor(audio.currentTime);

      let minutes = Math.floor(totalSeconds / 60);
      let seconds = totalSeconds % 60;

      currentTime.innerHTML = `
    <span id="currenttimeIndex">${minutes}:</span>${seconds}
  `;

      let durationMinutes = Math.floor(audio.duration / 60);
      let durationSeconds = Math.floor(audio.duration % 60);

      duration.innerHTML = `${durationMinutes}:${durationSeconds}`;
      progress.addEventListener("input", () => {
        audio.currentTime = (progress.value / 100) * audio.duration;
      });
    });

    setTimeout(() => {
      bydefault(count);
    }, 1000);
    playBtn.addEventListener("click", () => {
      if (isPlaying == false) {
        isPlaying = true;
        truecondition();
      } else {
        isPlaying = false;
        falsecondition();
      }
    });
    function bydefault(count) {
      intro.innerHTML += `<img
        id="cover"
        src=${songsdata[count].image}
        />
        
        <h2 id="title">${songsdata[count].title}</h2>
        <p id="artist">${songsdata[count].artist}</p>`;
      currentTime.textContent = audio.currentTime.toFixed(2);
      duration.textContent = (audio.duration / 60).toFixed(2);
      // console.log(audio.);
    }
    nextBtn.addEventListener("click", () => {
      if (count == 4) {
        count = -1;
      }
      count++;
      intro.innerHTML = `<img
            id="cover"
            src=${songsdata[count].image}
            />
            
            
            <h2 id="title">${songsdata[count].title}</h2>
            <p id="artist">${songsdata[count].artist}</p>
            `;
      audio.src = songsdata[count].src;
      truecondition();
    });
    prevBtn.addEventListener("click", () => {
      console.log(count);
      if (count <= 0) {
        count = 5;
      }

      count--;
      intro.innerHTML = `<img
    id="cover"
    src=${songsdata[count].image}
    />
    
    <h2 id="title">${songsdata[count].title}</h2>
    <p id="artist">${songsdata[count].artist}</p>
    
    `;
      audio.src = songsdata[count].src;

      truecondition();
    });
    function truecondition() {
      playIcon.classList.add("nonactive");
      pauseIcon.classList.add("active");
      audio.play();
    }
    function falsecondition() {
      playIcon.classList.remove("nonactive");
      pauseIcon.classList.remove("active");
      audio.pause();
    }
  </script>
</html>

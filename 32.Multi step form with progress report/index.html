<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application form</title>
  </head>
  <body>
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Registration Form</title>

        <link
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet"
        />

        <style>
          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
          }

          body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1f2937, #111827, #0f172a);
            padding: 30px;
          }

          .form-container1 {
            width: 100%;
            display: flex;
            flex-direction: column;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            padding: 40px;
            box-shadow:
              0 20px 60px rgba(0, 0, 0, 0.45),
              inset 0 1px 0 rgba(255, 255, 255, 0.08);
          }

          .form-container1 h2 {
            color: #fff;
            font-size: 32px;
            text-align: center;
            margin-top: 70px;
            margin-bottom: 8px;
            font-weight: 700;
          }

          .form-container1 p {
            color: #bfc7d3;
            text-align: center;
            margin-bottom: 35px;
            font-size: 15px;
          }

          .input-group {
            margin-bottom: 22px;
          }

          .input-group label {
            display: block;
            color: #fff;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
          }

          .input-group input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 15px;
            transition: 0.35s ease;
            outline: none;
          }

          .input-group input::placeholder {
            color: #9ca3af;
          }

          .input-group input:focus {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.08);
            box-shadow:
              0 0 0 4px rgba(59, 130, 246, 0.18),
              0 8px 25px rgba(59, 130, 246, 0.25);
          }

          button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.35s;
            z-index: 99;
            margin-top: 10px;
          }

          button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.45);
          }

          button:active {
            transform: scale(0.98);
          }

          @media (max-width: 600px) {
            .form-container1 {
              padding: 28px;
            }

            .form-container1 h2 {
              font-size: 26px;
              margin-top: 100px;
            }
          }
          .circle-parent {
            display: flex;
            align-items: center;
            justify-content: center;
            justify-content: space-between;
            position: relative;
          }

          .child-div {
            width: 100%;
            position: absolute;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
          }
          .childs {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: center;
            font-size: 1.5rem;
            width: 50px;
            border-radius: 50%;
            background-color: white;
          }
          .childs:nth-child(1) {
            background-color: blue;
            color: white;
          }
          .none {
            display: none;
          }

          .progress-bar {
            margin-left: 10px;
            margin-top: 15px;
            height: 20px;
            background-color: blue;
          }
          .color {
            color: white;
            background-color: blue;
          }
          .personal-form,
          .pro-detail,
          .submitsec {
            display: none;
          }

          .active {
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
          }
        </style>
      </head>
      <body>
        <div class="personal-info form-container1">
          <div class="circle-parent">
            <div class="progress-bar"></div>
            <div class="child-div">
              <div class="childs">1</div>
              <div class="childs">2</div>
              <div class="childs">3</div>
            </div>
          </div>
          <h2 class="head2">Job Application Form</h2>
          <form class="active personal-form">
            <p>Personal information.</p>
            <div class="input-group">
              <label>Full Name</label>
              <input id="name" type="text" placeholder="Enter your full name" />
            </div>

            <div class="input-group">
              <label>Phone Number</label>
              <input id="phone" type="tel" placeholder="03XX-XXXXXXX" />
            </div>

            <div class="input-group">
              <label>Email Address</label>
              <input id="email" type="email" placeholder="example@email.com" />
            </div>

            <div class="input-group">
              <label>CNIC Number</label>
              <input id="cnic" type="text" placeholder="XXXXX-XXXXXXX-X" />
            </div>
            <div class="input-group">
              <label>City</label>
              <input id="city" type="text" placeholder="Lahore" />
            </div>
          </form>

          <form class="pro-detail form-container1">
            <p>Professional Details</p>
            <div class="input-group">
              <label>Education Level</label>
              <input id="Education" type="text" placeholder="FSC,BS" />
            </div>

            <div class="input-group">
              <label>Years of Experience</label>
              <input id="exp" type="text" placeholder="2 Years,5 Years" />
            </div>

            <div class="input-group">
              <label>Skills</label>
              <input
                id="Skills"
                type="text"
                placeholder="Mern Stack Developer,Full Stack Developer"
              />
            </div>

            <div class="input-group">
              <label>Current Salary</label>
              <input id="currentsalary" type="text" placeholder="45000/-" />
            </div>
            <div class="input-group">
              <label>Expected Salary</label>
              <input id="expsalary" type="text" placeholder="60000/-" />
            </div>
          </form>
          
          <form class="form-container1 submitsec">
            <p>Review and Submit</p>
            <div class="result"></div>
            <button class="edit-personal">Edit Personal Information</button>
            <button class="edit-pro">Edit Professional Details</button>
            <button class="submit-button">Submit</button>
          </form>

          <button class="Next" type="submit">Next</button>
          <button class="previous none" type="submit">previous</button>
        </div>
      </body>
    </html>
  </body>
  <script>
    let progressBar = document.querySelector(".progress-bar");
    /////profesional detail section
    let proDetail = document.querySelector(".pro-detail");
    /////PERSONAL detail section
    let personalForm = document.querySelector(".personal-form");
    ///// PERSONAL detail section BUTTON
    let nextBtn = document.querySelector(".Next");
    let previousBtn = document.querySelector("previous");
    /////SUBMIT section
    let submit = document.querySelector(".submitsec");
    //// submit section button
    let submitBtn = document.querySelector(".submit-button");
    /////circlr childs
    let childsAll = document.querySelectorAll(".childs");
    //////edit personal info button
    let personalBtn = document.querySelector(".edit-personal");
    /////edit professional detail button
    let editingBtn = document.querySelector(".edit-pro");
    let result = document.querySelector(".result");
    ///////personal info
    let nameInp = document.querySelector("#name");
    let cnicInp = document.querySelector("#cnic");
    let emailInp = document.querySelector("#email");
    let phoneInp = document.querySelector("#phone");
    let cityInp = document.querySelector("#city");

    let phoneCheck = /^03\d{2}-\d{7}$/;
    let cnicCheck = /^\d{5}-\d{7}-\d{1}$/;
    let cityCheck = /^[A-Za-z/s]{2,10}$/;

    let csCheck = /^\d{5}$/;

    let objPersonal =
      JSON.parse(localStorage.getItem("objPersonalvalue")) || {};
    let objProfessional =
      JSON.parse(localStorage.getItem("objProfessionalvalue")) || {};
    personalForm.addEventListener("submit", (e) => {
      e.preventDefault();
    });
    nextBtn.addEventListener("click", () => {
      let personal = personalRegex();
      console.log(personal);

      if (personal == true) {
        objPersonal = {
          name: nameInp.value,
          email: emailInp.value,
          phone: phoneInp.value,
          cnic: cnicInp.value,
          city: cityInp.value,
        };
        localStorage.setItem("objPersonalvalue", JSON.stringify(objPersonal));
        index++;
        if (index === 1) {
          if (personalForm.classList.contains("active")) {
            personalForm.classList.remove("active");
            proDetail.classList.add("active");
            progressBar.style.width = "50%";
            childsAll[1].classList.add("color");
          }
        }
      }

      if (index >= 2) {
        let professional = professionalRegex();
        if (professional == true) {
          objProfessional = {
            education: educationInp.value,
            experience: experienceInp.value,
            skills: skillsInp.value,
            currentSalary: csInp.value,
            expected: expInp.value,
          };
          localStorage.setItem(
            "objProfessionalvalue",
            JSON.stringify(objProfessional),
          );

          if (proDetail.classList.contains("active")) {
            proDetail.classList.remove("active");
            submit.classList.add("active");
            nextBtn.classList.add("none");
            progressBar.style.width = "100%";
            childsAll[2].classList.add("color");
          }
        }
        result.innerHTML = `<div>
                Name: ${objPersonal.name}<br>
                Phone: ${objPersonal.phone}<br>
                Education: ${objProfessional.education}<br>
                Cnic: ${objPersonal.cnic}<br>
                City: ${objPersonal.city}<br>
                Email: ${objPersonal.email}<br>
                Experience: ${objProfessional.experience}<br>
                Skills: ${objProfessional.skills}<br>
                Current salary: ${objProfessional.currentSalary}<br>
                Expected salary: ${objProfessional.expected}
              </div>`;
      }
    });
    submitBtn.addEventListener("click", () => {
      alert("Form Submitted");
    });
    submit.addEventListener("submit", (e) => {
      e.preventDefault();
    });
    proDetail.addEventListener("submit", (e) => {
      e.preventDefault();
    });
    console.log("sultan khalid".split(""));

    personalBtn.addEventListener("click", () => {
      if (submit.classList.contains("active")) {
        personalForm.classList.add("active");
        submit.classList.remove("active");
        nextBtn.classList.remove("none");
        index = progressBar.style.width = "0%";
        childsAll[1].classList.remove("color");
        childsAll[2].classList.remove("color");
      }
    });
    editingBtn.addEventListener("click", () => {
      if (submit.classList.contains("active")) {
        proDetail.classList.add("active");
        submit.classList.remove("active");
        nextBtn.classList.remove("none");
        progressBar.style.width = "50%";
        childsAll[1].classList.add("color");
        childsAll[2].classList.remove("color");
      }
    });
    function professionalRegex() {
      if (!eduCheck.test(educationInp.value)) {
        alert("please enter valid education");
        return false;
      } else if (!experienceCheck.test(experienceInp.value)) {
        alert("please enter valid experiance");

        return false;
      } else if (!skillsCheck.test(skillsInp.value)) {
        alert("please enter valid skills");
        return false;
      } else if (!csCheck.test(csInp.value)) {
        alert("please enter valid current salary");
        return false;
      } else if (!expCheck.test(expInp.value)) {
        alert("please enter your city expected salary");
        return false;
      } else return true;
    }
    function personalRegex() {
      if (!nameCheck.test(nameInp.value)) {
        alert("please enter valid name");
        return false;
      } else if (!emailCheck.test(emailInp.value)) {
        alert("please enter valid email");
        return false;
      } else if (!phoneCheck.test(phoneInp.value)) {
        alert("please enter valid number");
        return false;

      } else if (!cityCheck.test(cityInp.value)) {
        alert("please enter your city name");
        return false;
      } else return true;
    }
  </script>
</html>

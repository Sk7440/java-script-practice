<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1f2937, #111827, #0f172a);
        padding: 30px;
      }

      .form-container {
        width: 100%;
        max-width: 520px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 22px;
        padding: 40px;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .form-container h2 {
        color: #fff;
        font-size: 32px;
        text-align: center;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .form-container p {
        color: #bfc7d3;
        text-align: center;
        margin-bottom: 35px;
        font-size: 15px;
      }

      .input-group {
        margin-bottom: 22px;
      }

      .input-group label {
        display: block;
        color: #fff;
        font-size: 14px;
        margin-bottom: 8px;
        font-weight: 500;
      }

      .input-group input {
        width: 100%;
        padding: 16px 18px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font-size: 15px;
        transition: 0.35s ease;
        outline: none;
      }

      .input-group input::placeholder {
        color: #9ca3af;
      }

      .input-group input:focus {
        border-color: #3b82f6;
        background: rgba(59, 130, 246, 0.08);
        box-shadow:
          0 0 0 4px rgba(59, 130, 246, 0.18),
          0 8px 25px rgba(59, 130, 246, 0.25);
      }

      button {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #2563eb, #06b6d4);
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.35s;
        margin-top: 10px;
      }

      button:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 35px rgba(37, 99, 235, 0.45);
      }

      button:active {
        transform: scale(0.98);
      }

      @media (max-width: 600px) {
        .form-container {
          padding: 28px;
        }

        .form-container h2 {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>Registration Form</h2>
      <p>Please fill in your information below.</p>

      <form>
        <div class="input-group">
          <label>Full Name</label>
          <input id="name" type="text" placeholder="Enter your full name" />
        </div>

        <div class="input-group">
          <label>Phone Number</label>
          <input id="phone" type="tel" placeholder="03XX-XXXXXXX" />
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <input id="email" type="email" placeholder="example@email.com" />
        </div>

        <div class="input-group">
          <label>CNIC Number</label>
          <input id="cnic" type="text" placeholder="XXXXX-XXXXXXX-X" />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input id="pass" type="text" placeholder="abAB123$@" />
        </div>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
  <script>
    let form = document.querySelector("form");
    let nameInp = document.querySelector("#name");
    let cnicInp = document.querySelector("#cnic");
    let emailInp = document.querySelector("#email");
    let phoneInp = document.querySelector("#phone"); 
    let passwordInp = document.querySelector("#pass"); 

    let nameCheck = /^[A-Za-z\s]{2,50}$/;
    let emailCheck = /^\w+@\w+\.[A-Za-z]{2,50}$/;
    let phoneCheck = /^03\d{2}-\d{7}$/;
    let cnicCheck = /^\d{5}-\d{7}-\d{1}$/;
    let passCheck = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%&*!]).{8,}$/
       form.addEventListener("submit", (e) => {
        e.preventDefault()
      if (!nameCheck.test(nameInp.value))
        return alert("please enter valid name");
      else if (!emailCheck.test(emailInp.value))
        return alert("please enter valid email");
      else if (!phoneCheck.test(phoneInp.value))
        return alert("please enter valid number");
      else if (!cnicCheck.test(cnicInp.value))
        return alert("please enter valid cnic");
      else if (!passCheck.test(passwordInp.value))
        return alert("please enter valid password");
    });
  </script>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- GSAP CDN Link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  </head>
  <style>
    body {
      margin: 0;
      overflow-x: hidden;
      font-family: sans-serif;
    }

    .main-section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }

    /* Overlay Divs Setup */
    .anim-overlay {
      position: fixed;
      left: 0;
      width: 100%;
      height: 50vh;
      z-index: 9999;
      pointer-events: none;
    }

    .top-div {
      top: -50vh;
      background-color: #4f46e5; /* Indigo */
    }

    .bottom-div {
      bottom: -50vh;
      background-color: #ec4899; /* Pink */
    }
  </style>
  <body>
    <!-- Current Section that will be hidden after the animation -->
    <section id="current-section" class="main-section">
      <h1>Current Section</h1>
      <p>This content will disappear after the transition.</p>
      <button id="animate-btn">Trigger Animation</button>
    </section>

    <!-- Animation Overlay Divs -->
    <div class="anim-overlay top-div"></div>
    <div class="anim-overlay bottom-div"></div>
  </body>
  
  <script>
    document.getElementById("animate-btn").addEventListener("click", () => {
      const tl = gsap.timeline({
        onComplete: () => {
          // Hide the current section after collision and full coverage
          document.getElementById("current-section").style.display = "none";
        },
      });

      // Both divs slide in simultaneously to meet in the middle
      tl.to(".top-div", {
        y: "50vh",
        duration: 0.8,
        ease: "power2.inOut",
      })
        .to(
          ".bottom-div",
          {
            y: "-50vh",
            duration: 0.8,
            ease: "power2.inOut",
          },
          "<",
        ) // '<' ensures both animations start at the exact same time

        // Optional: Reset positions if you need to reverse the transition later
        .to([".top-div", ".bottom-div"], {
          opacity: 0,
          duration: 0.3,
          delay: 0.2,
        });
    });
  </script>
</html>

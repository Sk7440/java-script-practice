    <title>Classic Memory Game</title>
    <!-- Classic serif/editorial typography from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Lora', serif;
        background-color: #f4f1ea; /* Soft vintage parchment tone */
        color: #2c221e;
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 40px 20px;
        background-image: radial-gradient(#e3dcd1 1px, transparent 1px);
        background-size: 24px 24px;
      }

      /* Classic Game Header / Dashboard */
      .game-header {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-bottom: 35px;
        flex-wrap: wrap;
        width: 100%;
        max-width: 900px;
      }

      .stat-panel {
        background: #fffdf9;
        border: 2px solid #dcd3c1;
        border-radius: 6px;
        padding: 12px 25px;
        text-align: center;
        min-width: 140px;
        box-shadow: 0 4px 12px rgba(44, 34, 30, 0.05);
      }

      .stat-panel h1 {
        font-family: 'Playfair Display', serif;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #7c6f64;
        margin-bottom: 4px;
        font-weight: 600;
      }

      .score, .moves, #display {
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: #8c3d22; /* Rich vintage rust tone */
      }

      #display {
        color: #2c5282; /* Classic navy tone for timer */
      }

      /* Game Board Grid Layout */
      body {
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 20px;
        max-width: 1050px;
        margin: 0 auto;
      }

      .main-box {
        width: 125px;
        display: flex;
        height: 175px;
        perspective: 1000px;
        position: relative;
        cursor: pointer;
      }
      
      .box {
        margin: 0;
        width: 100%;
        height: 100%;
        transition: transform 0.6s cubic-bezier(0.3, 0.7, 0.4, 1);
        transform-style: preserve-3d;
      }

      .active {
        transform: rotateY(180deg);
      }

      /* Card Faces Design */
      .front, .back {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        backface-visibility: hidden;
        border-radius: 8px;
        box-shadow: 0 6px 16px rgba(44, 34, 30, 0.12);
      }

      /* Classic Front Card (Unflipped State) */
      .front {
        background-color: #8c3d22;
        background-image: 
          linear-gradient(45deg, #743118 25%, transparent 25%), 
          linear-gradient(-45deg, #743118 25%, transparent 25%), 
          linear-gradient(45deg, transparent 75%, #743118 75%), 
          linear-gradient(-45deg, transparent 75%, #743118 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        border: 3px solid #fffdf9;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Inner monogram ornament on the back-of-card view */
      .front::after {
        content: "§";
        font-family: 'Playfair Display', serif;
        font-size: 2rem;
        color: #e3dcd1;
        opacity: 0.8;
      }

      /* Classic Back Card (Revealed Image State) */
      .back {
        background-color: #fffdf9;
        border: 3px solid #dcd3c1;
        transform: rotateY(-180deg);
        padding: 6px;
      }

      .back img {
        object-fit: cover;
        height: 100%;
        width: 100%;
        display: block;
        border-radius: 4px;
      }

      /* Responsive Adjustments */
      @media (max-width: 600px) {
        .main-box {
          width: 95px;
          height: 135px;
        }
      }
    </style>

  <script>
    let mainBox = document.querySelectorAll(".main-box");
    let box = document.querySelector(".box");
    let score = document.querySelector(".score");
    let moves = document.querySelector(".moves");
    let timer = document.querySelector(".timer");
    let centiSecEl = document.querySelector("#msec");
    let secondEl = document.querySelector("#second");
    let minuteEl = document.querySelector("#Minutes");
    let moveIndex = 0;
    let scoreIndex = 0;
    let src1;
    let matchedSrc;
    let src2;
    let centiSec = 0;
    let minute = 0;
    let second = 0;

    let id;
    mainBox.forEach((ele, idx) => {
      let image = document.querySelector("img");
      let imageSrc = image.getAttribute("src");

      ele.addEventListener("click", () => {
        Timer();
        moves.textContent = ++moveIndex;
        ele.firstElementChild.classList.add("active");

        if (ele.firstElementChild.solved == true) {
          return
        }

        if (src1) {
          src2 = ele.firstElementChild;
        } else {
          src1 = ele.firstElementChild;
          return;
        }

        if (
          src1.firstElementChild.firstElementChild.getAttribute("src") ===
          src2.firstElementChild.firstElementChild.getAttribute("src")
        ) {
          src1.solved = true
          src2.solved = true
          alert("choor");
          score.textContent = ++scoreIndex;
            src1 = undefined;
            src2 = undefined;
        } else {
          setTimeout(() => {
            src1.classList.remove("active");

            src2.classList.remove("active");
            src1 = undefined;
            src2 = undefined;
          }, 1000);
        }
      });
    });
    function Timer() {
      if (!id) {
        id = setInterval(() => {
          centiSec++;
          if (centiSec < 10) {
            centiSecEl.textContent = " 0 " + centiSec;
          } else {
            centiSecEl.textContent = centiSec;
          }
          if (centiSec == 99) {
            centiSec = "0" + 0;
            centiSecEl.textContent = "00";
            second++;
            if (second < 10) {
              secondEl.textContent = "0" + second;
            } else {
              secondEl.textContent = second;
            }
          } else if (second == 60) {
            second = 0;
            secondEl.textContent = "00";

            minute++;
            if (minute < 10) {
              minuteEl.textContent = "0" + minute;
            } else {
              minuteEl.textContent = minute;
            }
          }
        }, 10);
      }
    }
